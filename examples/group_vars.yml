---
edge_management_cidrs:
  - 192.168.10.0/24
edge_acme_email: admin@example.com
edge_observability:
  enabled: true
  metrics_endpoint: https://victoriametrics.example.net/opentelemetry/v1/metrics
  logs_endpoint: https://victorialogs.example.net/insert/opentelemetry/v1/logs
  collection_interval: 30s
  traefik_metrics_interval: 10s
  headers: {}
edge_security:
  forwarded_headers:
    trusted_ips:
      - 192.168.10.1/32
  rate_limit:
    enabled: true
    average: 120
    burst: 240
    period: 1m
  in_flight_requests:
    enabled: true
    amount: 100
edge_services:
  jellyfin:
    exposure: https
    hostname: jellyfin.example.com
    listen:
      ports: [443]
    destination:
      host: 192.168.10.50
      port: 8096
      protocol: http
  synology:
    exposure: https
    hostname: nas.example.com
    listen:
      ports: [443]
    destination:
      host: 192.168.10.10
      port: 5001
      protocol: https
  synology-drive:
    exposure: tcp
    listen:
      ports: [6690]
    destination:
      host: 192.168.10.10
      port: 6690
      protocol: tcp
      # Enable only when the TCP backend supports PROXY protocol.
      proxy_protocol_version: 2
  game-server:
    exposure: udp
    listen:
      ports: ["2456-2458"]
    destination:
      host: 192.168.20.10
      port: 2456
      protocol: udp
