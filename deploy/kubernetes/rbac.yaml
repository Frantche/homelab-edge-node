---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-kubernetes-controller
  namespace: homelab-edge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-kubernetes-controller
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tcproutes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-kubernetes-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edge-kubernetes-controller
subjects:
  - kind: ServiceAccount
    name: edge-kubernetes-controller
    namespace: homelab-edge-system
