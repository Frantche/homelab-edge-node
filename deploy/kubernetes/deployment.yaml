---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-kubernetes-controller
  namespace: homelab-edge-system
  labels:
    app.kubernetes.io/name: edge-kubernetes-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-kubernetes-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-kubernetes-controller
    spec:
      serviceAccountName: edge-kubernetes-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/frantche/homelab-edge-node:0.3.0
          imagePullPolicy: IfNotPresent
          command: [/edge-kubernetes-controller]
          args: [-config, /etc/homelab-edge-node/controller.yml]
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/homelab-edge-node
              readOnly: true
            - name: edge-publication-client-tls
              mountPath: /var/run/edge-publication
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: edge-kubernetes-controller
        - name: edge-publication-client-tls
          secret:
            secretName: edge-publication-client-tls
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
